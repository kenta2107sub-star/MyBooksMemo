name: MyBooksMemo
options:
  bundleIdPrefix: com.kenta2107substar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  projectFormat: xcode15_0
configs:
  Debug: debug
  Release: release
# architecture.md 8.3：WORKERS_SHARED_SECRET・CLOUDFLARE_WORKERS_URLをソースコードに
# ハードコードしないため、xcconfig経由でBuild Settingsに注入する（Project levelのConfigurations）。
# Secrets.xcconfigはsetup.md手順3でSecrets.xcconfig.exampleからコピーして作成する（.gitignore対象）。
configFiles:
  Debug: MyBooksMemo/Secrets.xcconfig
  Release: MyBooksMemo/Secrets.xcconfig
targets:
  MyBooksMemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    scheme: {}
    sources:
      - path: MyBooksMemo
        # Secrets.xcconfig.exampleはビルド設定のテンプレート（テキスト）でありアプリに同梱する
        # リソースではないため、Resourcesビルドフェーズへの自動追加から除外する
        excludes:
          - "Secrets.xcconfig.example"
    info:
      path: MyBooksMemo/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "本のバーコードをスキャンして登録するためにカメラを使用します"
        CloudflareWorkersURL: "$(CLOUDFLARE_WORKERS_URL)"
        WorkersSharedSecret: "$(WORKERS_SHARED_SECRET)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenta2107substar.MyBooksMemo
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
    scheme:
      testTargets:
        - MyBooksMemoTests
  # Phase 7 Step B（testing-runner）：CloudflareWorkersClient（ネットワークをURLProtocolでモック化）・
  # SwiftDataモデル（Book/MemoEntry/ConversationLogのCRUD・カスケード削除）の単体テスト用ターゲット。
  MyBooksMemoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MyBooksMemoTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.kenta2107substar.MyBooksMemoTests
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: MyBooksMemo
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: MyBooksMemo
